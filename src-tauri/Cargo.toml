[package]
name = "repo-mirror"
version = "0.3.1"
description = "A local GitHub folder synchronizer"
authors = ["RepoMirror"]
edition = "2021"

[lib]
name = "repo_mirror_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3"
url = "2"
walkdir = "2"
